[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-job-assistant"
version = "0.1.0"
description = "Local assistant that collects Croatian student jobs, scores them and alerts/applies via Gmail."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "apscheduler==3.11.3",
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "pydantic-settings==2.15.0",
  "phonenumbers==9.0.41",
  "rapidfuzz==3.14.6",
  "keyring==25.7.0",
  "imap-tools==1.16.0",  # reads only the "reply DA" answers (D42)
  "tzdata==2026.5",  # time zone database (Windows has none)
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.16.10",
]
browser = ["playwright==1.63.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]  # the normal FastAPI way to ask for a database session

[tool.coverage.run]
source = ["app"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
