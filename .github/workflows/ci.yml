# Runs on every push and pull request: the linter, then the whole test suite with a coverage report.
# Windows runner on purpose (Ivan's PC is Windows). Needs no secrets and sends nothing anywhere:
# tests use a throwaway data folder, hand-made pages and a fake mail sender (DECISIONS D36).
# The 12-minute browser round (scripts/run_all_ui_checks.ps1) stays on Ivan's PC.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Tests with coverage (pytest)
        run: python -m pytest -q --durations=15 --cov --cov-report=term --cov-report=markdown:coverage.md
      - name: Show coverage on the run page
        if: always()
        shell: bash
        run: |
          if [ -f coverage.md ]; then
            { echo "### Coverage (information only, never fails the run)"; cat coverage.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
