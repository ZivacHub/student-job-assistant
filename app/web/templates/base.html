<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>{% block title %}Studentski poslovi{% endblock %} · Studentski poslovi</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Preskoči na sadržaj</a>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/">Studentski poslovi</a>
      <nav class="nav" aria-label="Glavna navigacija">
        <a href="/poslovi" {% if nav == "poslovi" %}aria-current="page"{% endif %}>Poslovi</a>
        <a href="/prijave" {% if nav == "prijave" %}aria-current="page"{% endif %}>Prijave</a>
        <a href="/izvori" {% if nav == "izvori" %}aria-current="page"{% endif %}>Izvori</a>
        <a href="/dnevnik" {% if nav == "dnevnik" %}aria-current="page"{% endif %}>Dnevnik</a>
        <a href="/gmail" {% if nav == "gmail" %}aria-current="page"{% endif %}>Gmail</a>
        <a href="/mjesta" {% if nav == "mjesta" %}aria-current="page"{% endif %}>Mjesta i profil</a>
      </nav>
      {% if dry_run %}
      <p class="mode" title="Ništa se ne šalje poslodavcima dok to ne uključite i odobrite.">Slanje je isključeno</p>
      {% elif dry_run is defined %}
      <p class="mode mode--live" title="Odobrene poruke odlaze poslodavcima kad završi rok za poništavanje."><a href="/prijave#stanje">Stvarno slanje je uključeno</a></p>
      {% endif %}
      <button class="theme-toggle" type="button" data-theme-toggle hidden title="Svijetla ili tamna tema">
        <svg class="theme-toggle__icon theme-toggle__moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="theme-toggle__icon theme-toggle__sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="visually-hidden theme-toggle__to-dark">Prebaci na tamnu temu</span>
        <span class="visually-hidden theme-toggle__to-light">Prebaci na svijetlu temu</span>
      </button>
    </div>
  </header>
  <main id="main" class="page">
    {% block main %}{% endblock %}
  </main>
  <script src="/static/forms.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
